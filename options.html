<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepPage</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; color: #1f2937;
  padding: 40px; max-width: 540px; margin: 0 auto;
}
h1 { font-size: 20px; margin-bottom: 8px; }
p { color: #6b7280; margin-bottom: 24px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input, textarea {
  width: 100%; padding: 10px 14px; border: 1px solid #d1d5db;
  border-radius: 8px; font-size: 14px; font-family: monospace;
}
input:focus, textarea:focus { border-color: #4A6CF7; outline: none; }
textarea { resize: vertical; font-family: inherit; }
small { display: block; color: #9ca3af; margin: 4px 0 16px; }
button {
  border: none; border-radius: 8px;
  cursor: pointer; font-weight: 600;
}
#status { margin-top: 12px; font-size: 13px; }
#status.ok { color: #059669; }
#status.err { color: #dc2626; }

.section-title {
  font-size: 16px; margin: 24px 0 12px;
  padding-top: 20px; border-top: 1px solid #e5e7eb;
}

/* 外观设置卡片 */
.appearance-card {
  background: #f9fafb; border: 1px solid #e5e7eb;
  border-radius: 10px; padding: 14px; margin-bottom: 12px;
}
.appearance-row {
  display: flex; align-items: center;
  justify-content: space-between;
}
.appearance-row span { font-size: 14px; font-weight: 500; }

/* 开关组件 */
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  cursor: pointer;
}
.toggle-switch input { display: none; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 24px;
  transition: background 0.2s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  left: 2px; top: 2px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle-switch input:checked + .toggle-slider {
  background: #4A6CF7;
}
.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(20px);
}

/* 按钮卡片 */
.action-card {
  background: #f9fafb; border: 1px solid #e5e7eb;
  border-radius: 10px; padding: 14px; margin-bottom: 12px;
}
.action-card .card-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.action-card .card-index {
  font-size: 12px; color: #9ca3af; font-weight: 600;
  background: #e5e7eb; border-radius: 50%;
  width: 22px; height: 22px; display: flex;
  align-items: center; justify-content: center;
}
.action-card label { font-size: 13px; margin-bottom: 4px; }
.action-card input { font-size: 13px; padding: 8px 10px; }
.action-card textarea { font-size: 13px; padding: 8px 10px; min-height: 48px; }
.action-card .btn-del {
  margin-left: auto; background: #fee2e2; color: #dc2626;
  width: 28px; height: 28px; border-radius: 6px;
  font-size: 16px; line-height: 1; display: flex;
  align-items: center; justify-content: center;
}
.action-card .btn-del:hover { background: #fecaca; }

.btn-primary {
  padding: 10px 24px; background: #4A6CF7; color: white; font-size: 14px;
}
.btn-primary:hover { background: #6B8AFF; }

.btn-add {
  padding: 8px 16px; background: #eef2ff; color: #4A6CF7;
  font-size: 13px; border: 1px dashed #4A6CF7;
}
.btn-add:hover { background: #dbe8ff; }

@media (prefers-color-scheme: dark) {
  body { background: #1a1b1e; color: #e4e5e7; }
  input, textarea, select {
    background: #25262b; border-color: #373a40; color: #e4e5e7;
  }
  input:focus, textarea:focus { border-color: #4A6CF7; }
  h1, h2, label { color: #e4e5e7; }
  p, small { color: #9ca3af; }
  .action-card {
    background: #222328; border-color: #373a40;
  }
  .action-card .card-index {
    background: #373a40; color: #9ca3af;
  }
  .action-card .btn-del {
    background: #4a1a1a; color: #f87171;
  }
  .action-card .btn-del:hover {
    background: #5c2020;
  }
  .btn-add {
    background: #1a2740; color: #6B8AFF; border-color: #4A6CF7;
  }
  .btn-add:hover {
    background: #253a5a;
  }
  .section-title { border-top-color: #373a40; }
  .appearance-card {
    background: #222328; border-color: #373a40;
  }
  .appearance-row span { color: #e4e5e7; }
  .toggle-slider { background: #4b5563; }
  .toggle-slider::before { background: #e4e5e7; }
  .toggle-switch input:checked + .toggle-slider {
    background: #4A6CF7;
  }
  #status.ok { color: #34d399; }
  #status.err { color: #f87171; }
}
/* 手动 dark mode 切换 */
.__dp-dark-options {
  background: #1a1b1e; color: #e4e5e7;
}
.__dp-dark-options input,
.__dp-dark-options textarea,
.__dp-dark-options select {
  background: #25262b; border-color: #373a40; color: #e4e5e7;
}
.__dp-dark-options input:focus,
.__dp-dark-options textarea:focus { border-color: #4A6CF7; }
.__dp-dark-options h1,
.__dp-dark-options h2,
.__dp-dark-options label { color: #e4e5e7; }
.__dp-dark-options p,
.__dp-dark-options small { color: #9ca3af; }
.__dp-dark-options .action-card {
  background: #222328; border-color: #373a40;
}
.__dp-dark-options .action-card .card-index {
  background: #373a40; color: #9ca3af;
}
.__dp-dark-options .action-card .btn-del {
  background: #4a1a1a; color: #f87171;
}
.__dp-dark-options .action-card .btn-del:hover {
  background: #5c2020;
}
.__dp-dark-options .btn-add {
  background: #1a2740; color: #6B8AFF; border-color: #4A6CF7;
}
.__dp-dark-options .btn-add:hover {
  background: #253a5a;
}
.__dp-dark-options .section-title { border-top-color: #373a40; }
.__dp-dark-options .appearance-card {
  background: #222328; border-color: #373a40;
}
.__dp-dark-options .appearance-row span { color: #e4e5e7; }
.__dp-dark-options .toggle-slider { background: #4b5563; }
.__dp-dark-options .toggle-slider::before { background: #e4e5e7; }
.__dp-dark-options .toggle-switch input:checked + .toggle-slider {
  background: #4A6CF7;
}
.__dp-dark-options #status.ok { color: #34d399; }
.__dp-dark-options #status.err { color: #f87171; }
</style>
</head>

<p id="l10n-optionDesc">Chat with DeepSeek while browsing</p>

<label for="apiKey"><span id="l10n-apiKeyLabel">DeepSeek API Key</span></label>
<input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
<small><a href="https://platform.deepseek.com/api_keys" target="_blank"><span id="l10n-getApiKeyLink">Get API Key</span></a></small>

<h2 class="section-title"><span id="l10n-languageLabel">Language</span></h2>
<select id="language-select" style="width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:20px"></select>

<div class="appearance-card">
  <div class="appearance-row">
    <span id="l10n-darkModeLabel">Dark Mode</span>
    <label class="toggle-switch">
      <input type="checkbox" id="dark-mode-toggle" />
      <span class="toggle-slider"></span>
    </label>
  </div>
</div>

<h2 class="section-title"><span id="l10n-quickActionsSection">Quick Action Buttons</span></h2>

<div id="actions-container"></div>

<button id="btn-add" class="btn-add">＋ <span id="l10n-addButton">Add Button</span></button>

<p style="margin-top:24px">
  <button id="saveBtn" class="btn-primary"><span id="l10n-saveButton">Save</span></button>
</p>
<div id="status"></div>

<script src="i18n.js"></script>
<script src="options.js"></script>
