<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepPage 设置</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; color: #1f2937;
  padding: 40px; max-width: 500px; margin: 0 auto;
}
h1 { font-size: 20px; margin-bottom: 8px; }
p { color: #6b7280; margin-bottom: 24px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input {
  width: 100%; padding: 10px 14px; border: 1px solid #d1d5db;
  border-radius: 8px; font-size: 14px; font-family: monospace;
}
input:focus { border-color: #4A6CF7; outline: none; }
small { display: block; color: #9ca3af; margin: 4px 0 16px; }
button {
  padding: 10px 24px; border: none; border-radius: 8px;
  background: #4A6CF7; color: white; font-size: 14px;
  cursor: pointer; font-weight: 600;
}
button:hover { background: #6B8AFF; }
#status { margin-top: 12px; font-size: 13px; }
#status.ok { color: #059669; }
#status.err { color: #dc2626; }
</style>
</head>
<body>
<h1>🧊 DeepPage 设置</h1>
<p>使用 DeepSeek 官方 API 与浏览的网页对话</p>

<label for="apiKey">DeepSeek API Key</label>
<input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
<small>从 <a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com</a> 获取</small>

<button id="saveBtn">保存</button>
<div id="status"></div>

<script src="options.js"></script>
</body>
</html>
