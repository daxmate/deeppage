<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>DeepPage Markdown 测试</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; display: flex; gap: 24px; padding: 24px; }
  .col { flex: 1; max-width: 420px; }
  h2 { font-size: 14px; color: #666; margin: 0 0 12px; }
  .__dp-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    word-break: break-word;
    font-size: 13px;
    background: #f3f4f6;
    color: #1f2937;
    border-bottom-left-radius: 4px;
  }
  .__dp-bubble.dark {
    background: #25262b;
    color: #e4e5e7;
  }
  /* 完整 CSS 拷贝 */
.__dp-bubble code { background: #e8e8eb; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; }
.__dp-bubble pre { background: #f0f0f0; padding: 12px; border-radius: 8px; margin: 8px 0; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.__dp-bubble pre code { background: none; padding: 0; font-size: inherit; }
.__dp-bubble a { color: #4A6CF7; text-decoration: underline; }
.__dp-bubble em { font-style: italic; }
.__dp-bubble strong { font-weight: 700; }
.__dp-bubble h1,.__dp-bubble h2,.__dp-bubble h3,.__dp-bubble h4 { margin: 12px 0 6px; font-weight: 600; line-height: 1.3; }
.__dp-bubble h1 { font-size: 18px; } .__dp-bubble h2 { font-size: 16px; } .__dp-bubble h3 { font-size: 15px; } .__dp-bubble h4 { font-size: 14px; }
.__dp-bubble ul,.__dp-bubble ol { padding-left: 20px; margin: 6px 0; } .__dp-bubble li { margin: 2px 0; }
.__dp-bubble blockquote { border-left: 3px solid #4A6CF7; margin: 8px 0; padding: 4px 12px; color: #555; background: #f8f9fc; border-radius: 0 6px 6px 0; }
.__dp-bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
.__dp-bubble th,.__dp-bubble td { border: 1px solid #d0d9f0; padding: 6px 10px; text-align: left; }
.__dp-bubble th { background: #eef2ff; font-weight: 600; }
.__dp-bubble hr { border: none; border-top: 1px solid #d0d9f0; margin: 12px 0; }
.__dp-bubble del { text-decoration: line-through; }
.__dp-bubble input[type="checkbox"] { margin: 0 4px 0 0; pointer-events: none; }
.__dp-bubble p { margin: 4px 0; }
@media (prefers-color-scheme: dark) {
  .__dp-bubble.dark blockquote { border-left-color: #6B8AFF; color: #a0a4b0; background: #222328; }
  .__dp-bubble.dark th { background: #1a2740; }
  .__dp-bubble.dark th,.__dp-bubble.dark td { border-color: #373a40; }
  .__dp-bubble.dark hr { border-top-color: #373a40; }
}
</style>
</head>
<body>
  <div class="col">
    <h2>浅色模式</h2>
    <div id="light" class="__dp-bubble"></div>
  </div>
  <div class="col">
    <h2>暗色模式</h2>
    <div id="dark" class="__dp-bubble dark"></div>
  </div>
  <script src="marked.umd.min.js"></script>
  <script>
    const md = `# Markdown 测试

## 标题 & 文本

这是一段**粗体**、*斜体*、~~删除线~~和\`代码\`。
这是一个[链接](https://example.com)。

## 列表

- 无序列表项一
- 无序列表项二
  - 嵌套项

1. 有序列表一
2. 有序列表二

## 引用 & 代码

> 这是一段引用文字
> 多行引用效果

\`\`\`javascript
function hello() {
  console.log("Hello DeepPage!");
}
\`\`\`

## 表格

| 功能 | 支持情况 |
| --- | --- |
| 标题 | ✅ |
| 列表 | ✅ |
| 表格 | ✅ |

## 任务列表

- [x] 支持 Markdown
- [ ] 更多测试

---

分割线以上内容。`;

    const html = marked.parse(md, { breaks: true, gfm: true });
    document.getElementById('light').innerHTML = html;
    document.getElementById('dark').innerHTML = html;
    document.title = '✓ DeepPage Markdown 测试';
  </script>
</body>
</html>
