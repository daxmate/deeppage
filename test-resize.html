<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试 - 可调整大小的浮动窗口</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  padding: 40px;
  min-height: 100vh;
  background: #f0f2f5;
}

h1 { font-size: 18px; color: #333; margin-bottom: 20px; }

/* 和 DeepPage 一样的浮动按钮 */
#float-btn {
  all: unset;
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #4A6CF7;
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 999999;
  box-shadow: 0 4px 16px rgba(74,108,247,.35);
  transition: transform .2s;
}
#float-btn:hover { transform: scale(1.1); }

/* 浮动面板 — 要点就在这里 */
#float-panel {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 380px;
  height: 560px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,.18);
  border: 1px solid #e5e7eb;
  z-index: 999998;
  display: flex;
  flex-direction: column;
  overflow: hidden;        /* 试试改成 overflow: auto 看区别 */
  resize: both;
  min-width: 280px;
  min-height: 350px;
  max-width: 90vw;
  max-height: 90vh;
  transition: opacity .2s, transform .2s;
}

/* 头部 */
#panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid #e5e7eb;
  font-weight: 600;
  cursor: move;
  flex-shrink: 0;
}

/* 内容区 */
#panel-content {
  flex: 1;
  padding: 20px 16px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.6;
  color: #333;
}

#panel-content p { margin-bottom: 12px; }
#panel-content code {
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
}

/* 底部 */
#panel-footer {
  padding: 10px 16px;
  border-top: 1px solid #e5e7eb;
  font-size: 12px;
  color: #9ca3af;
  text-align: center;
  flex-shrink: 0;
}

/* 隐藏状态 */
#float-panel.hidden {
  opacity: 0;
  transform: scale(.95);
  pointer-events: none;
}
</style>
</head>
<body>

<h1>🧊 DeepPage 浮动窗口测试</h1>

<button id="float-btn">🧊</button>

<div id="float-panel" class="hidden">
  <div id="panel-header">
    <span>🧊 DeepPage 测试</span>
    <button id="close-btn" style="background:none;border:none;font-size:18px;cursor:pointer;color:#9ca3af;">✕</button>
  </div>
  <div id="panel-content">
    <p><strong>测试：拖动右下角以调整窗口大小</strong></p>
    <p>浏览器原生的 resize 手柄在右下角。</p>
    <p>当前样式：</p>
    <code>overflow: hidden;<br>resize: both;<br>border-radius: 16px;</code>
    <p style="margin-top:16px">尝试调整大小看看是否生效。</p>
    <p>你可以修改上面的 CSS，试试 <code>overflow: auto</code> 的效果。</p>
  </div>
  <div id="panel-footer">拖拽右下角调整大小</div>
</div>

<script>
const btn = document.getElementById('float-btn');
const panel = document.getElementById('float-panel');
const closeBtn = document.getElementById('close-btn');

btn.addEventListener('click', () => {
  panel.classList.toggle('hidden');
});

closeBtn.addEventListener('click', () => {
  panel.classList.add('hidden');
});

// 拖动（通过header）
const header = document.getElementById('panel-header');
let isDragging = false, startX, startY, startLeft, startTop;

header.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  isDragging = true;
  const rect = panel.getBoundingClientRect();
  startX = e.clientX; startY = e.clientY;
  startLeft = rect.left; startTop = rect.top;
  panel.style.bottom = 'auto'; panel.style.right = 'auto';
  panel.style.left = startLeft + 'px'; panel.style.top = startTop + 'px';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panel.style.left = (startLeft + e.clientX - startX) + 'px';
  panel.style.top = (startTop + e.clientY - startY) + 'px';
});

document.addEventListener('mouseup', () => { isDragging = false; });
</script>

</body>
</html>
