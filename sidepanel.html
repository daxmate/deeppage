<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepPage</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; color: #1f2937;
  display: flex; flex-direction: column; height: 100vh;
  background: #fff;
}

/* Header */
#header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-bottom: 1px solid #e5e7eb;
  font-weight: 600; font-size: 15px; flex-shrink: 0;
}

/* Context bar */
#context-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 16px; background: #f0f5ff;
  font-size: 12px; color: #4A6CF7; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#context-bar.hidden { display: none; }

/* Chat area */
#chat {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 12px;
}

.msg {
  display: flex; flex-direction: column; max-width: 90%;
  animation: fadein .2s ease;
}
.msg.user { align-self: flex-end; }
.msg.assistant { align-self: flex-start; }
.msg .bubble {
  padding: 10px 14px; border-radius: 12px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; font-size: 13px;
}
.msg.user .bubble {
  background: #4A6CF7; color: white; border-bottom-right-radius: 4px;
}
.msg.assistant .bubble {
  background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 4px;
}

.welcome {
  text-align: center; color: #9ca3af; font-size: 13px; padding: 40px 0;
}
.welcome .icon { font-size: 36px; margin-bottom: 8px; }

@keyframes fadein {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Loading indicator */
.loading {
  align-self: flex-start; padding: 10px 14px;
  background: #f3f4f6; border-radius: 12px;
  border-bottom-left-radius: 4px; font-size: 20px; line-height: 1;
  color: #9ca3af;
}
.loading span { animation: dot 1s infinite; }
.loading span:nth-child(2) { animation-delay: .2s; }
.loading span:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

/* Login notice */
#login-notice {
  display: none; padding: 12px 16px; margin: 8px 16px;
  background: #fff3cd; border-radius: 8px; text-align: center;
  font-size: 13px; color: #856404; flex-shrink: 0;
}
#login-notice.show { display: block; }
#login-notice a { color: #4A6CF7; text-decoration: underline; cursor: pointer; }

/* Input row */
#input-row {
  display: flex; gap: 8px; padding: 10px 16px;
  border-top: 1px solid #e5e7eb; flex-shrink: 0;
}
#input {
  flex: 1; min-height: 36px; max-height: 80px;
  padding: 8px 12px; border: 1px solid #d1d5db;
  border-radius: 10px; resize: none; outline: none;
  font-family: inherit; font-size: 14px; line-height: 1.5;
}
#input:focus { border-color: #4A6CF7; }
#send-btn {
  width: 36px; height: 36px; border: none; border-radius: 10px;
  background: #4A6CF7; color: white; font-size: 16px;
  cursor: pointer; flex-shrink: 0;
}
#send-btn:disabled { opacity: .5; cursor: not-allowed; }
#send-btn:not(:disabled):hover { background: #6B8AFF; }

.error { color: #dc3545; }

@media (prefers-color-scheme: dark) {
  body { background: #1a1b1e; color: #e4e5e7; }
  #header { border-color: #373a40; }
  #context-bar { background: #1a2740; }
  .msg.assistant .bubble { background: #25262b; color: #e4e5e7; }
  .loading { background: #25262b; }
  #input { background: #25262b; border-color: #373a40; color: #e4e5e7; }
  #input-row { border-color: #373a40; background: #1a1b1e; }
}
</style>
</head>
<body>

<div id="header">
  <span>🧊 DeepPage</span>
</div>

<div id="context-bar" class="hidden">
  📄 <span id="context-title"></span>
</div>

<div id="login-notice">
  请先前往 <a href="#" id="login-link">chat.deepseek.com</a> 登录 DeepSeek 账号
</div>

<div id="chat">
  <div class="welcome">
    <div class="icon">🧊</div>
    点击右下角 🧊 按钮<br>加载当前网页内容
  </div>
</div>

<div id="input-row">
  <textarea id="input" placeholder="输入问题..." disabled></textarea>
  <button id="send-btn" disabled>➤</button>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
